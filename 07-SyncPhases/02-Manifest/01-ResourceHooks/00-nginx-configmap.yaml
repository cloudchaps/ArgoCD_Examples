apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: emartapp-application
  annotations:
    argocd.argoproj.io/hook: PreSync # Ensure service is present before application sync
    argocd.argoproj.io/sync-wave: "-1" # Deploys very early
    argocd.argoproj.io/hook-delete-policy: HookFailed # define when the hook will be deleted
data:
  nginx.conf: |
    events {}
    http {
      upstream client {
          server client:4200;
      }
      server {
          listen 80;
          location / {
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://client/;
          }
          location /api {
              proxy_pass http://nodeapi-service:5000;
          }
          location /webapi {
              proxy_pass http://javaapi-service:9000;
          }
      }
    }