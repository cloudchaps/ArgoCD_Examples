# argocd-manager-crb.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin # Use a more restricted role in production
subjects:
- kind: ServiceAccount
  name: argocd-manager
  namespace: kube-system
