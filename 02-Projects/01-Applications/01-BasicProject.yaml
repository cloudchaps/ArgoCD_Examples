apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: guestbook-demo-project
  namespace: argocd
spec: 
  destination: 
    namespace: guestbook
    server: "https://kubernetes.default.svc"
  project: plaink8s-project
  source: 
    path: 02-Projects/02-Manifest/01-BasicProjects
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true