apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: helm-app
  namespace: argocd
spec: 
  destination: 
    namespace: helm-app
    server: "https://kubernetes.default.svc"
  project: default
  source: 
    path: 01-Applications/02-Manifest/02-Helm
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: main
    helm:
     releaseName: my-release
  syncPolicy:
    syncOptions:
      - CreateNamespace=true