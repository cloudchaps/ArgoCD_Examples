apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: istiod
  namespace: argocd
spec: 
  destination:
    namespace: istio-system
    server: "https://kubernetes.default.svc"
  project: default
  source:
    path: 01-DiffingCustomization
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: 1.13.4
    chart: istiod
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'