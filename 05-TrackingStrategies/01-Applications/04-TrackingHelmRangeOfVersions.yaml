apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: 04-tracking-rangeversion-app
  namespace: argocd
spec:
  destination:
    namespace: helm-config
    server: "https://kubernetes.default.svc"
  project: helmk8s-project
  source: 
    path: 04-SyncOptions/02-Manifest/01-TrackingStrategies
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: 1.* # you can use greater than and smaller than ex: >=3.0.0 <4.1.0
    helm:
      releaseName: my-release
      valueFiles:
        - values.yaml
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true