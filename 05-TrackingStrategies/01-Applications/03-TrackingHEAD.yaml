apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: 03-tracking-head-app
  namespace: argocd
spec:
  destination:
    namespace: helm-config
    server: "https://kubernetes.default.svc"
  project: helmk8s-project
  source: 
    path: 05-TrackingStrategies/02-Manifest/01-TrackingStrategies
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: HEAD # this will track the latest commit on the default branch
    helm:
      releaseName: my-release
      valueFiles:
        - values.yaml
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true