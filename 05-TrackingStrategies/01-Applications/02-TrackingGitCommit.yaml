apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: track-commit
  namespace: argocd
spec:
  destination:
    namespace: track-commit
    server: "https://kubernetes.default.svc"
  project: default
  source: 
    path: 02-TrackingGitCommit
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: 2455bb6
    directory:
      recurse: true
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true