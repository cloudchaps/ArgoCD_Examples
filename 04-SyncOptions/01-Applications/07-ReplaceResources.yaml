apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: replace-resources
  namespace: argocd
spec:
  destination:
    namespace: replace-resources
    server: "https://kubernetes.default.svc"
  project: default
  source: 
    path: 07-ReplaceResources
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: master
    directory:
      recurse: true
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - Replace=true