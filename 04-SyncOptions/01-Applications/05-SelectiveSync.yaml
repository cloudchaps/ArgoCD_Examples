apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: selective-sync
  namespace: argocd
spec:
  destination:
    namespace: selective-sync
    server: "https://kubernetes.default.svc"
  project: default
  source: 
    path: 05-SelectiveSync
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: master
    directory:
      recurse: true
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true