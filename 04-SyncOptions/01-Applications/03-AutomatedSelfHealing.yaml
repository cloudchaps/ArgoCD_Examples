apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: auto-selfheal-app
  namespace: argocd
spec:
  destination:
    namespace: helm-config
    server: "https://kubernetes.default.svc"
  project: helmk8s-project
  source: 
    path: 04-SyncOptions/02-Manifest/01-AutomatedSync
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: main
    helm:
      releaseName: my-release
      valueFiles:
        - values.yaml
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true