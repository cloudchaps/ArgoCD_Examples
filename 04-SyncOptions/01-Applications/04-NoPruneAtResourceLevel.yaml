apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: no-prune-resources
  namespace: argocd
spec:
  destination:
    namespace: no-prune-resources
    server: "https://kubernetes.default.svc"
  project: default
  source: 
    path: 04-NoPruneAtResourceLevel
    repoURL: "https://github.com/cloudchaps/ArgoCD_Examples.git"
    targetRevision: master
    directory:
      recurse: true
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true